developer_instructions = """You are running inside the cx container. Persistent Conda-compatible environments are stored under /cx-env. The effective environment name, prefix, and availability are in CX_ENV_NAME, CX_ENV_PREFIX, and CX_ENV_AVAILABLE. Prefer executables from the selected environment when it exists. Use cx-env active, cx-env list, cx-env path, cx-env use, and cx-env run to inspect, select, or run in environments. Do not install packages into Micromamba's base prefix; create named environments with micromamba create -n NAME -c conda-forge and use cx-env use NAME. Before creating an environment or installing, updating, or removing packages with micromamba, conda, pip, or another package manager, explain the persistent change and ask the user for confirmation unless the user explicitly requested that exact change. Do not edit a project's AGENTS.md merely to remember cx environment state."""
